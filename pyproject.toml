[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools>=64",
    "wheel",
    "setuptools-scm>=8"
]

[project]
name = "icesat2db"
dynamic = ["version"]
description = "icesat2db: A toolbox for Ice, Cloud, and land Elevation Satellite 2 (ICESat-2) ATL08 data"
readme = "README.md"
authors = [
    { name = "Felix Dombrowski", email = "felixd@gfz.de" },
    { name = "Mikhail Urbazaev", email = "urbazaev@gfz.de" },
    { name = "Simon Besnard", email = "besnard@gfz.de" },
    { name = "Amelia Holcomb", email = "amelia.holcomb@gmail.com" }
]
license = { file = "LICENSE" }
keywords = ["geospatial", "ICESat-2", "database"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)"
]
requires-python = ">=3.10"
dependencies = [
    "dask",
    "distributed",
    "geopandas",
    "h5py",
    "numpy",
    "pandas",
    "requests",
    "retry",
    "scipy",
    "tiledb==0.35.2",
    "xarray",
    "boto3"
]

[project.urls]
homepage = "https://github.com/simonbesnard1/icesat2db"
documentation = "https://icesat2db.readthedocs.io/en/latest/"
source = "https://github.com/simonbesnard1/icesat2db"
tracker = "https://github.com/simonbesnard1/icesat2db/issues"

[project.optional-dependencies]
accel = [
    "bottleneck",
    "numbagg",
    "flox",
    "opt_einsum",
    "numba",
    "cython"
]
dev = [
    "hypothesis",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "pytest-env",
    "pytest-xdist",
    "pytest-timeout",
    "ruff",
    "icesat2db[complete]",
    "black",
    "isort"
]
io = [
    "boto3",
    "netCDF4",
    "h5netcdf",
    'pydap; python_version<"3.10"',
    "zarr",
    "fsspec",
    "cftime",
    "pooch",
    "rasterio",
    "pyproj"
]
viz = [
    "cartopy",
    "matplotlib",
    "seaborn",
    "nc-time-axis",
    "plotly",
    "holoviews"
]
debug = [
    "rich",
    "loguru"
]

[tool.mypy]
enable_error_code = ["ignore-without-code", "redundant-self", "redundant-expr"]
exclude = [
  'build',
]
files = "icesat2db"
show_error_context = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
extend-exclude = [
  "doc",
  "_typed_ops.pyi",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["icesat2db/tests*", "icesat2db/tests/*", "icesat2db/tests/**/*", "scripts*"]

[tool.setuptools_scm]
fallback_version = "9999"

